<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<h1>컨텐츠에 데이터 출력하기</h1>
<ul>
    <li>th:text 사용<span th:text="${data}"></span></li>
    <li>컨텐츠 안에서 직접 출력하기 = [[${data}]]</li>
</ul>
</body>
</html>
<!--
  Escape
  HTML 문서는 '<', '>' 같은 특수 문자를 기반으로 정의된다.
  따라서 뷰 템플릿으로 HTML 화면을 생성할 때는 출력하는 데이터에 이러한 특수 문자가 있는 것을 주의해서 사용해야 한다.
  앞에서 만든 예제의 데이터를 다음과 같이 변경해서 실행해보자.

  변경 전 "Hello Spring!"
  변경 후 "Hello <b>Spring!</b>"

  <b>태그를 사용해서 Spring!이라는 단어가 진하게 나오도록 해보자.

  웹 브라우저에서 실행결과를 보자.
  - 웹 브라우저 : Hello <b>Spring!</b>
  - 소스보기 : Hello &lt;b&gt;Spring!&lt;/b&gt;

  개발자가 의도한 것은 <b>가 있으면 해당 부분을 강조하는 것이 목적이었다.
  그런데 <b> 태그가 그대로 나온다. 소스보기를 하면 '<' 부분이 '&lt;'로 변경된 것을 확인할 수 있다.
-->

<!--
  HTML 엔티티
  웹 브라우저는 '<'를 HTML 태그의 시작으로 인식한다.
  따라서 '<'를 태그의 시작이 아니라 문자로 표현할 수 있는 방법이 필요한데, 이것을 HTML 엔티티라 한다.
  그리고 이렇게 HTML에서 사용하는 특수 문자를 HTML 엔티티로 변경하는 것을 이스케이프(escape)라고 한다.
  그리고 타임리프가 제공하는 th:text, [[...]]는 기본적으로 이스케이프(escape)를 제공한다.

  - < -> &lt;
  - > -> &gt;
  - 기타 수많은 HTML 엔티티가 있다.
-->

<!--
  Unescape
  이스케이프 기능을 사용하지 않으려면 어떻게 해야할까?
  - 타임리프는 다음 두 기능을 제공한다.
  - th:text -> th:utext
  - [[...]] -> [(...)]
-->
